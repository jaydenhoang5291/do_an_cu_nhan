defaultUe:
  msin: "0000000001"
  key: "8baf473f2f8fd09487cccbd7097c6862"
  op: "8e27b6af0e692e750f32667a3b14605d"
  amf: "8000"
  sqn: "00000000"
  dnn: "internet"
  routingindicator: "0000"
  hplmn:
    mcc: "208"
    mnc: "93"
  snssai:
    sst: 01
    sd: "010203"
  integrity:
    nia0: false
    nia1: false
    nia2: true
    nia3: false
  ciphering:
    nea0: true
    nea1: false
    nea2: true
    nea3: false
  delay: 1000 # set delay of assign event to each ue in 1 group (milisecond)
amfif:
  - ip: "192.168.1.110"
    port: 38412
simulation:
  enable: true
  packetLoss: 0
  latencyMs: 20
  jitterMs: 0
scenarios:
  - nUEs: 1
    gnbs:
      - "000006"
    ueEvents:
      - event: "RegisterInit Event"
        delay: 0
        register_type: 0
        # - event: "PduSessionInit Event"
        #   delay: 0
remote:
  enable: true
  ip: "0.0.0.0"
  port: 4000
testconf:
  enableFuzz: false
  5gmm:
    states:
      - "Registered State"
      - "Deregisterd State"
    events:
      - "RegisterInit Event"
      - "DeregistraterInit Event"
      - "RegistrationAcceptEvent Event"
      - "DeregistrationAcceptEvent Event"
  5gsm:
    states:
      - "PDUSessionActive State"
      - "PDUSessionInactive State"
    events:
      - "PduSessionInit Event"
      - "EstablishmentAccept Event"
      - "DestroyPduSession Event"
loglevel: info # info, trace, debug, warn, error, fatal, panic
logging:
  ueLogBufferSize: 50 # Number of log entries to keep per UE
  gnbLogBufferSize: 100 # Number of log entries to keep per gNB
